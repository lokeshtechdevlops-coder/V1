services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: hospital
      POSTGRES_PASSWORD: hospital_local
      POSTGRES_DB: hospital
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - hospital_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hospital -d hospital"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  hospital_postgres:
